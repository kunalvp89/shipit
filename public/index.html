<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Private credit card bill reminder">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/app.css">
  <title>CardDue</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PRIVATE WALLET</div>
        <h1>CardDue</h1>
      </div>
      <button id="notifyBtn" class="icon-btn" title="Notifications" aria-label="Notifications">🔔</button>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="muted">Upcoming payments</p>
          <div id="totalUpcoming" class="hero-amount">₹0</div>
        </div>
        <button id="addCardBtn" class="primary-btn">+ Add card</button>
      </section>

      <section>
        <div class="section-head">
          <h2>Your cards</h2>
          <span id="cardCount" class="pill">0</span>
        </div>
        <div id="cardCarousel" class="card-carousel"></div>
        <div id="carouselDots" class="dots"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>Upcoming</h2>
          <button id="refreshBtn" class="text-btn">Refresh</button>
        </div>
        <div id="upcomingList" class="upcoming-list"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>Recent payments</h2>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <footer class="footer">
      <span>Data stays in this browser</span>
      <button id="exportBtn" class="text-btn">Export backup</button>
    </footer>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Add credit card</h2>
        <button id="closeModal" class="icon-btn">✕</button>
      </div>
      <form id="cardForm">
        <input type="hidden" id="cardId">
        <label>Card name<input id="cardName" required maxlength="40" placeholder="HDFC Regalia"></label>
        <label>Bank / issuer<input id="issuer" required maxlength="40" placeholder="HDFC Bank"></label>
        <label>Last 4 digits<input id="last4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="1234"></label>

        <div class="form-grid">
          <label>Statement day
            <input id="statementDay" type="number" min="1" max="31" required value="15">
          </label>
          <label>Due days after statement
            <input id="dueDays" type="number" min="0" max="60" required value="20">
          </label>
        </div>

        <label>Reminder days before due
          <input id="reminderDays" value="7,3,1,0" placeholder="7,3,1,0">
          <small>Example: 7,3,1,0 means 7 days, 3 days, 1 day and due day.</small>
        </label>

        <label class="switch-row">
          <span>Active reminders</span>
          <input id="active" type="checkbox" checked>
        </label>

        <button class="primary-btn full" type="submit">Save card</button>
      </form>
    </div>
  </div>

  <div id="billModalBackdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>Statement</h2>
        <button id="closeBillModal" class="icon-btn">✕</button>
      </div>
      <form id="billForm">
        <input type="hidden" id="billCardId">
        <label>Statement date<input id="billStatementDate" type="date" required></label>
        <label>Total amount<input id="billAmount" type="number" min="0" step="0.01" required placeholder="18450"></label>
        <label>Minimum due<input id="billMinimum" type="number" min="0" step="0.01" placeholder="1845"></label>
        <div class="calculated">
          <span>Calculated due date</span>
          <strong id="calculatedDueDate">—</strong>
        </div>
        <button class="primary-btn full" type="submit">Save statement</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/js/app.js"></script>
</body>
</html>
