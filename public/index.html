<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>ShipIt v0.3</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f5f7fb;min-height:100vh}.shell{max-width:720px;margin:auto;padding:20px 16px}.brand{font-size:25px;font-weight:800}.tag{color:#9ca5b7;font-size:14px;margin:7px 0 20px}.card{background:#13161f;border:1px solid #292f3d;border-radius:18px;padding:18px;margin-bottom:14px}label{display:block;font-size:13px;color:#aeb6c6;margin-bottom:7px}.field{margin-bottom:14px}input{width:100%;padding:13px;border-radius:12px;border:1px solid #343b4b;background:#0f1219;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drop{border:1px dashed #465066;border-radius:15px;padding:25px;text-align:center;cursor:pointer}.hidden{display:none}button{width:100%;padding:14px;border:0;border-radius:13px;background:#596cf3;color:#fff;font-weight:800;font-size:15px}.status{display:none;margin-top:14px}.show{display:block}.success{border-color:#235d4b;background:#0e1d19}.error{border-color:#6a3030;background:#211214}.body{white-space:pre-wrap;color:#aeb6c6;font-size:13px;line-height:1.55}a{color:#91a0ff}.hint{font-size:12px;color:#7f899c;line-height:1.5}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="brand">🚀 ShipIt</div><div class="tag">Create a GitHub repository and prepare its Vercel deployment from your phone.</div><section class="card"><form id="f"><div class="field"><label>Project ZIP</label><label class="drop" for="zip"><div style="font-size:30px">📦</div><b id="fn">Select project ZIP</b><div class="hint">The GitHub token never enters the browser.</div><input class="hidden" id="zip" name="project" type="file" accept=".zip" required></label></div><div class="field"><label>Vercel project / deployment name</label><input name="projectName" placeholder="my-expense-tracker" required></div><div class="row"><div class="field"><label>GitHub repository</label><input name="repositoryName" placeholder="my-expense-tracker" required></div><div class="field"><label>Branch</label><input name="branch" value="main" required></div></div><div class="field"><label>Commit message</label><input name="message" value="Ship project with ShipIt"></div><button id="b">🚀 Create & Ship</button></form><div id="s" class="card status"><b id="st"></b><div id="sb" class="body"></div></div></section><section class="card"><b>Environment</b><div class="hint">Only <b>GITHUB_TOKEN</b> is required. ShipIt discovers your GitHub account automatically, creates the requested repository, and pushes the selected branch.</div></section></main><script>const f=document.getElementById('f'),z=document.getElementById('zip'),fn=document.getElementById('fn'),s=document.getElementById('s'),st=document.getElementById('st'),sb=document.getElementById('sb'),b=document.getElementById('b');z.onchange=()=>fn.textContent=z.files[0]?.name||'Select project ZIP';function show(t,x,c){s.className='card status show '+(c||'');st.textContent=t;sb.innerHTML=x}f.onsubmit=async e=>{e.preventDefault();if(!z.files.length)return;b.disabled=true;b.textContent='⏳ Creating repository...';show('Creating and shipping','Authenticating to GitHub, creating the repository, and pushing your project...');try{const r=await fetch('/api/ship',{method:'POST',body:new FormData(f)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Ship failed');const w=d.project.warnings?.length?'\n\nWarnings:\n• '+d.project.warnings.join('\n• '):'';show('🚀 Project shipped',`GitHub account: ${d.githubAccount}\nRepository: ${d.github.repositoryUrl}\nBranch: ${d.github.branch}\nFiles: ${d.project.fileCount}\nDeployment project: ${d.projectName}\n\n<a href="${d.github.repositoryUrl}" target="_blank">Open repository →</a>\n<a href="${d.github.commitUrl}" target="_blank">Open commit →</a>\n\nVercel: ${d.deployment.message}${w}`,'success')}catch(e){show('❌ Ship failed',e.message,'error')}finally{b.disabled=false;b.textContent='🚀 Create & Ship'}};</script></body></html>
